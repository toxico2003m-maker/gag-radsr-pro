<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAG RADAR PRO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d17;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;background:#111c2d;
 border-bottom:1px solid #263a53;
}
h1{color:#55e6a5;margin:0}
nav{display:flex;gap:8px;padding:12px;overflow:auto}
button{
 background:#19283b;color:white;border:1px solid #30445e;
 padding:12px;border-radius:9px;white-space:nowrap;cursor:pointer;
}
button.active{background:#087e58}
main{padding:14px}
.panel{
 background:#111c2d;border:1px solid #263a53;
 padding:15px;border-radius:12px;margin-bottom:14px;
}
input,select{
 width:100%;padding:12px;margin:7px 0;
 background:#091321;color:white;
 border:1px solid #344b65;border-radius:8px;
}
.egg{
 padding:14px;background:#17283b;
 border-radius:10px;margin-top:10px;
 border-left:4px solid #55e6a5;
}
.small{color:#9cb2c8;font-size:13px}
</style>
</head>
<body>

<header>
<h1>GAG RADAR PRO</h1>
<p class="small">Grow a Garden · Radar gratuito</p>
</header>

<nav>
<button class="active" onclick="tab('radar',this)">Radar</button>
<button onclick="tab('atlas',this)">Atlas</button>
<button onclick="tab('pred',this)">Predicciones</button>
<button onclick="tab('pets',this)">Bestiario</button>
</nav>

<main>
<section id="radar">
<div class="panel">
<h2>🥚 Radar de huevos</h2>
<p class="small">Hallazgos del servidor</p>
<input id="search" placeholder="Buscar mascota o mutación"
oninput="render()">
<select id="biome" onchange="render()">
<option value="">Todos los biomas</option>
<option>Jardín</option>
<option>Volcán</option>
<option>Selva</option>
</select>
<div id="eggs"></div>
</div>
</section>

<section id="atlas" hidden>
<div class="panel">
<h2>📚 Atlas</h2>
<p>Historial de hallazgos</p>
<div id="history"></div>
</div>
</section>

<section id="pred" hidden>
<div class="panel">
<h2>🔮 Predicciones</h2>
<p>Próximos hallazgos</p>
<p class="small">Las predicciones son demostrativas,
no representan datos reales.</p>
</div>
</section>

<section id="pets" hidden>
<div class="panel">
<h2>🐾 Bestiario</h2>
<input placeholder="Buscar mascota">
<p>Información de mascotas próximamente.</p>
</div>
</section>
</main>

<script>
const data=[
 {pet:"Dragonfly",egg:"Legendary Egg",
 biome:"Jardín",mutation:"Normal"},
 {pet:"Queen Bee",egg:"Bee Egg",
 biome:"Selva",mutation:"Rainbow"},
 {pet:"T-Rex",egg:"Dinosaur Egg",
 biome:"Volcán",mutation:"Normal"}
];

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const b=document.getElementById("biome").value;
 const list=data.filter(x=>
 (x.pet.toLowerCase().includes(q)||
 x.mutation.toLowerCase().includes(q))&&
 (!b||x.biome===b)
 );
 document.getElementById("eggs").innerHTML=
 list.map(x=>`
 <div class="egg">
 <h3>🥚 ${x.egg}</h3>
 <b>🐾 ${x.pet}</b>
 <p class="small">Bioma: ${x.biome}</p>
 <p class="small">Mutación: ${x.mutation}</p>
 </div>`).join("")||
 "<p>No hay hallazgos.</p>";
}

function tab(id,btn){
 document.querySelectorAll("main section")
 .forEach(s=>s.hidden=true);
 document.getElementById(id).hidden=false;
 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

document.getElementById("history").innerHTML=
 data.map(x=>`<p>${x.pet} · ${x.egg}</p>`).join("");

render();
</script>
</body>
</html>
